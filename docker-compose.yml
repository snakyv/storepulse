services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storepulse}
      POSTGRES_USER: ${POSTGRES_USER:-storepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storepulse_dev_only}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - storepulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storepulse} -d ${POSTGRES_DB:-storepulse}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/dashboard}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  simulator-madrid:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      STORE_CODE: MAD-MADRID
      HEARTBEAT_INTERVAL: ${SIMULATOR_HEARTBEAT_INTERVAL:-5}
    depends_on:
      backend:
        condition: service_healthy

  simulator-london:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      STORE_CODE: MAD-LONDON
      HEARTBEAT_INTERVAL: ${SIMULATOR_HEARTBEAT_INTERVAL:-5}
    depends_on:
      backend:
        condition: service_healthy

  simulator-new-york:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      STORE_CODE: MAD-NYC
      HEARTBEAT_INTERVAL: ${SIMULATOR_HEARTBEAT_INTERVAL:-5}
    depends_on:
      backend:
        condition: service_healthy

  simulator-tokyo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      STORE_CODE: MAD-TOKYO
      HEARTBEAT_INTERVAL: ${SIMULATOR_HEARTBEAT_INTERVAL:-5}
    depends_on:
      backend:
        condition: service_healthy

  simulator-warsaw:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      STORE_CODE: MAD-WARSAW
      HEARTBEAT_INTERVAL: ${SIMULATOR_HEARTBEAT_INTERVAL:-5}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  storepulse_pgdata:

x-simulator-base: &simulator-base
  profiles: ["demo"]
  build:
    context: .
    dockerfile: simulator/Dockerfile
  depends_on:
    backend:
      condition: service_healthy
  restart: unless-stopped

x-simulator-environment: &simulator-environment
  BACKEND_URL: http://backend:8000
  RUN_TAG: ${SIMULATOR_RUN_TAG:-demo}
  HEARTBEAT_INTERVAL: ${SIMULATOR_HEARTBEAT_INTERVAL:-5}
  REFUND_RATE: ${SIMULATOR_REFUND_RATE:-0.20}
  DUPLICATE_RATE: ${SIMULATOR_DUPLICATE_RATE:-0.08}
  LATE_EVENT_RATE: ${SIMULATOR_LATE_EVENT_RATE:-0.10}
  MAX_LATE_SECONDS: ${SIMULATOR_MAX_LATE_SECONDS:-7200}
  MAX_QUANTITY: ${SIMULATOR_MAX_QUANTITY:-3}
  REQUEST_TIMEOUT_SECONDS: ${SIMULATOR_REQUEST_TIMEOUT_SECONDS:-5}
  RETRY_INITIAL_SECONDS: ${SIMULATOR_RETRY_INITIAL_SECONDS:-0.25}
  RETRY_MAX_SECONDS: ${SIMULATOR_RETRY_MAX_SECONDS:-5}
  RETRY_JITTER_RATIO: ${SIMULATOR_RETRY_JITTER_RATIO:-0.20}
  MAX_RETRY_ATTEMPTS: ${SIMULATOR_MAX_RETRY_ATTEMPTS:-0}
  QUEUE_SIZE: ${SIMULATOR_QUEUE_SIZE:-1000}
  WORKER_COUNT: ${SIMULATOR_WORKER_COUNT:-2}
  STATS_INTERVAL_SECONDS: ${SIMULATOR_STATS_INTERVAL_SECONDS:-30}

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storepulse}
      POSTGRES_USER: ${POSTGRES_USER:-storepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storepulse_dev_only}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - storepulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storepulse} -d ${POSTGRES_DB:-storepulse}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/dashboard}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  simulator-madrid:
    <<: *simulator-base
    environment:
      <<: *simulator-environment
      STORE_CODE: MAD-MADRID
      INSTANCE_LABEL: simulator-madrid
      EVENTS_PER_SECOND: ${SIMULATOR_MADRID_EVENTS_PER_SECOND:-1.0}
      RANDOM_SEED: 101

  simulator-london:
    <<: *simulator-base
    environment:
      <<: *simulator-environment
      STORE_CODE: MAD-LONDON
      INSTANCE_LABEL: simulator-london
      EVENTS_PER_SECOND: ${SIMULATOR_LONDON_EVENTS_PER_SECOND:-1.0}
      RANDOM_SEED: 202

  simulator-new-york:
    <<: *simulator-base
    environment:
      <<: *simulator-environment
      STORE_CODE: MAD-NYC
      INSTANCE_LABEL: simulator-new-york
      EVENTS_PER_SECOND: ${SIMULATOR_NYC_EVENTS_PER_SECOND:-1.0}
      RANDOM_SEED: 303

  simulator-tokyo:
    <<: *simulator-base
    environment:
      <<: *simulator-environment
      STORE_CODE: MAD-TOKYO
      INSTANCE_LABEL: simulator-tokyo
      EVENTS_PER_SECOND: ${SIMULATOR_TOKYO_EVENTS_PER_SECOND:-1.0}
      RANDOM_SEED: 404

  simulator-warsaw:
    <<: *simulator-base
    environment:
      <<: *simulator-environment
      STORE_CODE: MAD-WARSAW
      INSTANCE_LABEL: simulator-warsaw
      EVENTS_PER_SECOND: ${SIMULATOR_WARSAW_EVENTS_PER_SECOND:-1.0}
      RANDOM_SEED: 505

volumes:
  storepulse_pgdata:

[tool.pytest.ini_options]
markers = [
  "integration: requires a reachable PostgreSQL database with migrations and seed applied"
]
asyncio_mode = "auto"
# The application owns one pooled AsyncEngine per process/event loop. Mirror that model in tests.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = []

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: storepulse
          POSTGRES_USER: storepulse
          POSTGRES_PASSWORD: storepulse_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storepulse -d storepulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://storepulse:storepulse_dev_only@localhost:5432/storepulse
      FRONTEND_ORIGIN: http://localhost:5173
      OFFLINE_THRESHOLD_SECONDS: "30"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed deterministic data
        run: python -m app.seed
      - name: Ruff
        run: ruff check app tests ../simulator/simulator
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: python -m pytest -q
      - name: Compile simulator
        run: python -m compileall -q ../simulator/simulator

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Dependency tree
        run: npm ls --depth=0
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local environment file
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Start scaffold
        run: docker compose up -d --build postgres migrate seed backend frontend
      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend postgres migrate seed
          exit 1
      - name: Smoke-test seeded stores endpoint
        run: |
          curl --fail --silent http://localhost:8000/api/v1/stores > stores.json
          python - <<'PY'
          import json
          with open("stores.json", encoding="utf-8") as file:
              stores = json.load(file)
          assert len(stores) == 5, f"expected 5 stores, got {len(stores)}"
          PY
      - name: Smoke-test idempotent SALE ingestion
        run: |
          python - <<'PY'
          import datetime
          import json
          import urllib.error
          import urllib.request
          import uuid

          endpoint = "http://localhost:8000/api/v1/events"
          event_id = str(uuid.uuid4())
          payload = {
              "event_id": event_id,
              "store_code": "MAD-MADRID",
              "product_sku": "COFFEE-001",
              "event_type": "SALE",
              "quantity": 1,
              "amount_cents": 799,
              "occurred_at": datetime.datetime.now(datetime.UTC).isoformat(),
              "source_instance": "ci:docker-smoke",
              "metadata": {"origin": "github-actions"},
          }

          def post(body):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=5) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code, json.load(exc)

          accepted_status, accepted = post(payload)
          duplicate_status, duplicate = post(payload)
          conflict_payload = dict(payload)
          conflict_payload["amount_cents"] = 899
          conflict_status, conflict = post(conflict_payload)

          assert accepted_status == 201, (accepted_status, accepted)
          assert accepted["status"] == "accepted", accepted
          assert duplicate_status == 200, (duplicate_status, duplicate)
          assert duplicate["status"] == "duplicate", duplicate
          assert conflict_status == 409, (conflict_status, conflict)
          assert conflict["detail"] == "event_id already exists with different payload", conflict
          PY
      - name: Show service state
        if: always()
        run: docker compose ps
      - name: Tear down
        if: always()
        run: docker compose down -v
